<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        },
        theme: {
          extend: {
            colors: {
              brand: {
                red: 'var(--brand-theme-color, #D32F2F)',
                secondary: 'var(--brand-secondary, #FFFFFF)',
                accent: 'var(--brand-accent, #1E1E1E)',
                bg: 'var(--brand-bg, #0A0A0A)',
                surface: 'var(--brand-surface, #141414)',
                text: 'var(--brand-text, #FFFFFF)',
                muted: 'var(--brand-text-muted, #71717A)',
                dark: 'var(--brand-bg, #0A0A0A)', // fallback legacy
                charcoal: 'var(--brand-surface, #141414)', // fallback legacy
                gray: '#1E1E1E',
                light: 'var(--brand-text, #FFFFFF)', // fallback legacy
                cream: '#FAF9F6',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
